<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Organizer</title>
<!--
  Task Organizer
  Version 0.3.0 (Beta) · by alpine-marmot · 2026
  https://github.com/alpine-marmot/task-organizer · MIT-Lizenz

  CHANGELOG
  0.3.0 – 19.11.2026
    - Kunden-Import mit Vorschau: Kontakte einzeln an- und abwählen (alle vorausgewählt), Felder direkt korrigieren
    - Spalten der CSV werden automatisch erkannt (z. B. Firma, Vorname, Nachname, Mobile) und lassen sich per Auswahl neu zuordnen; Ladebalken während der Umwandlung
    - Bereinigung beim Import: Leerzeichen, E-Mail-Adressen, Telefonnummern im Schweizer Format, Excel-Zeichensatz, doppelte Einträge in der Datei
    - Doppelte Kunden beim Import: pro Kontakt zusammenführen (Standard), bestehenden behalten oder ersetzen
    - vCard-Import (.vcf), z. B. aus Apple Kontakte oder Outlook
    - Einstellungen › Kunden: Mehrfachauswahl mit Kästchen und «Ausgewählte löschen», «Doppelte finden» mit Zusammenführen
    - Kunden-Fenster: Knopf «Importieren» neben «Kundendaten bearbeiten»
    - Telefonnummern werden in den Kundenlisten vollständig angezeigt
    - Kurzmeldungen erscheinen jetzt auch vor geöffneten Fenstern
  0.2.2 – 19.11.2026
    - Veröffentlichung auf GitHub: Autor «alpine-marmot», Fusszeile mit Logo und Links zu Repository und Profil
  0.2.1 – 18.11.2026
    - Doppelklick auf die leere Fläche einer Spalte (Offen, Geplant, Warten) öffnet «Neue Aufgabe» mit dieser Spalte vorausgewählt
  0.2.0 – 14.11.2026
    - Wiederkehrende Aufgaben: täglich, wöchentlich, alle 2 Wochen, monatlich, jährlich oder eigenes Intervall
    - Nächstes Datum pro Aufgabe «ab Erledigt» oder «nach festem Plan»; neue Karte kommt in «Geplant» und erscheint kurz vor der Fälligkeit
    - Spalte «Geplant» zeigt kommende Wiederholungen zum Aufklappen
    - Kunden-Ansicht: Kundenkarte mit Kontaktdaten zum Anklicken, offenen und erledigten Aufgaben, Knopf «Neue Aufgabe für …»
    - Neues Kundenfeld «Ansprechperson» (Erfassung, Einstellungen, CSV-Import und -Export)
    - Sortier-Menü in den Spalten etwas breiter
  0.1.0 – 14.11.2026 – Erste Beta-Version
    - Zwei Bereiche: Privat und Geschäftlich, je mit eigenen Aufgaben und Kategorien; Kunden im geschäftlichen Bereich
    - Kanban mit vier Spalten: Offen, Geplant, Warten, Erledigt
    - Aufgabe mit Priorität 1–3, Kategorie mit Farbe, Fälligkeitsdatum und Notiz; geschäftlich mit Kunde (Telefon, E-Mail)
    - Kategorien und Kunden entstehen beim ersten Eintippen und werden danach vorgeschlagen
    - Sortierung pro Spalte: Priorität, Erfassungsdatum, Fälligkeit, Farbe oder Manuell
    - Drag & Drop zwischen und innerhalb der Spalten; zusätzlich Menü «Verschieben nach …» auf jeder Karte
    - Archiv: per Knopf oder automatisch nach 14 Tagen (einstellbar), Suche, Wiederherstellen, CSV-Export
    - Speichern direkt in eine Datei (File System Access API, Chrome/Edge), zusätzlich Zwischenspeicher im Browser, Sicherung exportieren/importieren
    - Einstellungen mit Reitern Allgemein, Kategorien und Kunden (inkl. CSV-Import)
    - Hilfe mit Ablauf-Diagramm und Datenschutz-Abschnitt; Hell/Dunkel, Deutsch/Englisch, Tastenkürzel
-->
<style>
:root{
  --bg:#f5f4f0;--surface:#ffffff;--surface2:#efede8;--text:#1f1e1c;--muted:#68665f;--faint:#9a978e;
  --border:#dedbd3;--border-strong:#bfbbb0;--accent:#2f6fd0;--accent-bg:#e6f0fb;--accent-text:#1d4f9c;
  --red:#d64545;--red-bg:#fcebeb;--red-text:#8f2424;
  --yellow:#e09a1f;--yellow-bg:#faeeda;--yellow-text:#7a4c06;
  --green:#5c9a24;--green-bg:#eaf3de;--green-text:#30580e;
  --danger:#b83232;--warn-bg:#fff3d6;--warn-text:#7a4c06;
  --radius:8px;--shadow:0 6px 24px rgba(0,0,0,.14);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#1b1b1a;--surface:#262624;--surface2:#30302d;--text:#ecebe6;--muted:#aeaca4;--faint:#858379;
  --border:#3d3d39;--border-strong:#55554f;--accent:#6aa3f0;--accent-bg:#1f3350;--accent-text:#b9d5fa;
  --red:#ec6b6b;--red-bg:#4a1f1f;--red-text:#f7c1c1;
  --yellow:#f0b24a;--yellow-bg:#47340f;--yellow-text:#fad79a;
  --green:#8cc456;--green-bg:#263a14;--green-text:#c9e6a6;
  --danger:#f07c7c;--warn-bg:#47340f;--warn-text:#fad79a;
  --shadow:0 6px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);padding:6px 12px;display:inline-flex;align-items:center;gap:6px}
button:hover{background:var(--surface2)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] button.primary{color:#0e1b2e}
button.primary:hover{filter:brightness(1.07)}
button.danger{color:var(--danger);border-color:var(--danger)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--surface2)}
button.icon{padding:6px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);padding:7px 10px;width:100%}
input[type=color]{padding:2px;width:34px;height:28px;cursor:pointer}
textarea{resize:vertical}
label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px}
svg.i{width:18px;height:18px;flex:none}
.hidden{display:none!important}

header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
header h1{font-size:18px;font-weight:600;margin:0 8px 0 0;display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.status{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);color:var(--muted)}
.status.ok{background:var(--green-bg);color:var(--green-text);border-color:transparent}
.status.warn{background:var(--warn-bg);color:var(--warn-text);border-color:transparent}
.status.err{background:var(--red-bg);color:var(--red-text);border-color:transparent}

.areabar{display:flex;gap:4px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--border);align-items:flex-end}
.areabar button{border:none;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:10px 16px 8px;color:var(--muted);font-weight:500}
.areabar button:hover{background:var(--surface2)}
.areabar button.on{border-bottom-color:var(--accent);color:var(--text);font-weight:600}
.areabar .count{margin-left:2px}

.toolbar{display:flex;gap:10px;align-items:center;padding:12px 18px 0;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px;max-width:460px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:34px}
.toolbar select{width:auto;max-width:220px}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px 18px 24px}
@media (max-width:1150px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.board{grid-template-columns:1fr}}
.col{background:var(--surface2);border-radius:12px;padding:10px;display:flex;flex-direction:column;min-height:340px;min-width:0}
.col-head{display:flex;align-items:center;gap:7px;padding:2px 2px 10px;font-weight:600;font-size:14px}
.col-dot{width:10px;height:10px;border-radius:50%;flex:none}
.count{font-size:12px;font-weight:500;background:var(--surface);border-radius:999px;padding:1px 8px;color:var(--muted)}
.col-head select{margin-left:auto;width:auto;font-size:12px;padding:3px 6px;font-weight:400;max-width:150px}
.col-tools{display:flex;justify-content:flex-end;margin:-4px 0 8px}
.col-tools button{font-size:12px;padding:3px 8px}
.col-body{flex:1;display:flex;flex-direction:column;gap:8px;border-radius:8px;padding:2px;transition:background .15s}
.col-body.over{background:var(--accent-bg);outline:2px dashed var(--accent)}
.col-body.drop-end::after{content:"";display:block;height:3px;border-radius:2px;background:var(--accent)}
.empty{font-size:13px;color:var(--faint);padding:14px 8px;text-align:center}

.card{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--border-strong);border-radius:4px 8px 8px 4px;padding:8px 10px;cursor:grab;font-size:13px;position:relative}
.card:hover{border-color:var(--border-strong)}
.card.dragging{opacity:.45}
.card.drop-before{box-shadow:0 -4px 0 -1px var(--accent)}
.card-top{display:flex;gap:6px;align-items:flex-start}
.card-title{font-size:14px;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.card.is-done .card-title{color:var(--muted)}
.card-note{color:var(--muted);margin-top:3px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pill{font-size:11.5px;padding:1px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;background:var(--surface2);color:var(--muted);border:1px solid var(--border);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill svg.i{width:12px;height:12px}
.pill.p1{background:var(--red-bg);color:var(--red-text);border-color:transparent;font-weight:600}
.pill.over{background:var(--red-bg);color:var(--red-text);border-color:transparent}
.pill.today{background:var(--yellow-bg);color:var(--yellow-text);border-color:transparent}
.pill.cust{background:var(--accent-bg);color:var(--accent-text);border-color:transparent}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}
.card-actions{display:flex;gap:2px;margin:-3px -5px 0 0}
.card-actions button{padding:3px 5px}
.card-actions svg.i{width:15px;height:15px}
.card-foot{display:flex;justify-content:flex-end;margin-top:6px}
.card-foot button{padding:3px 8px;font-size:12px}

.menu{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:190px}
.menu-h{font-size:12px;color:var(--muted);padding:4px 8px 6px}
.menu button{display:flex;width:100%;border:none;background:transparent;padding:7px 8px;font-size:13px;justify-content:flex-start}
.menu button:hover:not(:disabled){background:var(--accent-bg)}
.menu hr{border:none;border-top:1px solid var(--border);margin:4px 0}

dialog{border:none;border-radius:14px;padding:0;background:var(--surface);color:var(--text);box-shadow:var(--shadow);width:min(640px,94vw);max-height:90vh}
dialog.wide{width:min(980px,96vw)}
dialog::backdrop{background:rgba(0,0,0,.42)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:16px 20px 8px;position:sticky;top:0;background:var(--surface);z-index:2}
.dlg-head h2{font-size:18px;font-weight:600;margin:0;flex:1}
.dlg-body{padding:4px 20px 12px;overflow:auto}
.dlg-foot{display:flex;gap:8px;align-items:center;padding:12px 20px 16px;border-top:1px solid var(--border);flex-wrap:wrap}
.dlg-scroll{max-height:calc(90vh - 130px);overflow:auto}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;justify-content:center;white-space:nowrap}
.seg button.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.seg button.on-p1{background:var(--red-bg);border-color:var(--red);color:var(--red-text);font-weight:600}
.seg button.on-p2{background:var(--yellow-bg);border-color:var(--yellow);color:var(--yellow-text);font-weight:600}
.seg button.on-p3{background:var(--green-bg);border-color:var(--green);color:var(--green-text);font-weight:600}
.seg.small button{flex:none;padding:4px 12px;font-size:13px}
.err{color:var(--danger);font-size:13px;margin-top:6px}
.hint{font-size:12px;color:var(--faint);margin-top:4px}
.ac-wrap{position:relative}
.ac-wrap .cat-dot{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:3px}
.ac-wrap input.with-dot{padding-left:31px}
.ac{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:var(--shadow);z-index:10;max-height:230px;overflow:auto}
.ac div{padding:7px 10px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.ac div:last-child{border-bottom:none}
.ac div.sel,.ac div:hover{background:var(--accent-bg)}
.ac small{color:var(--muted);margin-left:auto}
.swatches{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.swatch{width:24px;height:24px;border-radius:6px;padding:0;border:2px solid transparent;display:inline-block}
.swatch.on{border-color:var(--text);box-shadow:inset 0 0 0 2px var(--surface)}
.due-row{display:flex;gap:6px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid3{grid-template-columns:1fr}}
.rep-custom{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px;flex-wrap:wrap}
.rep-custom input{width:70px}.rep-custom select{width:auto}
.rep-box{margin-top:8px}
button.pill{cursor:pointer;font:inherit;font-size:11.5px}
button.pill.cust:hover{text-decoration:underline}
.pill.rep{background:var(--surface2)}
.upcoming-toggle{margin-top:8px;font-size:12px;width:100%;justify-content:center;background:transparent;border-style:dashed;color:var(--muted)}
.card.upcoming{opacity:.62;border-style:dashed;border-left-style:solid}
.cust-head{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:14px;margin:2px 0 4px}
.cust-head a{color:var(--accent);text-decoration:none;display:inline-flex;gap:5px;align-items:center}
.cust-head a:hover{text-decoration:underline}
.cust-sec{font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 6px;display:flex;align-items:center;gap:7px}
.mini{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--border-strong);border-radius:4px 8px 8px 4px;padding:7px 10px;margin-bottom:6px;cursor:pointer;font-size:13px}
.mini:hover{border-color:var(--border-strong)}
.mini b{font-weight:600}
.cust-list td{cursor:pointer}
.cust-list td.nowrap,.list-table td.phone{white-space:nowrap}
.list-table td.phone{min-width:175px}
input[type=checkbox]{width:16px;height:16px;padding:0;margin:0;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
.list-table td.chk,.list-table th.chk,.imp-table td.chk,.imp-table th.chk{width:34px;text-align:center}
.bulkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.progress{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .12s linear}
.imp-sec{border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin:10px 0}
.imp-sec h3{margin:0 0 6px;font-size:14px;font-weight:600}
.imp-table input[type=text]{padding:4px 7px;font-size:13px}
.imp-table td{padding:4px 6px}
.imp-table tr.off td{opacity:.45}
.imp-table select{width:auto;font-size:12px;padding:3px 6px}
.pill.new{background:var(--green-bg);color:var(--green-text);border-color:transparent}
.map-table select{width:auto;min-width:170px}
.map-table td.ex{color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dup-group{border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin:10px 0}
.dup-group.off{opacity:.5}
.dup-group label.dup-head{display:flex;gap:8px;align-items:center;margin:0 0 6px;color:var(--text);font-size:14px;font-weight:600}
.dup-row{display:flex;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--border);font-size:13px;flex-wrap:wrap}
.dup-row input[type=radio]{width:16px;height:16px;accent-color:var(--accent)}
.dup-row .sub{color:var(--muted)}
.cust-list tr:hover td{background:var(--surface2)}
.due-row input{width:180px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border-strong);padding:6px}
td{border-bottom:1px solid var(--border);padding:6px;vertical-align:middle}
td.nowrap{white-space:nowrap}
td .sub{font-size:12px;color:var(--muted);white-space:pre-wrap}
.arch-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

.set-sec{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:10px 0}
.set-sec h3{margin:0 0 6px;font-size:15px;font-weight:600;display:flex;gap:6px;align-items:center}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.list-table td input{padding:4px 7px;font-size:13px}
.list-table .swatches{margin:0;gap:4px}
.list-table .swatch{width:18px;height:18px;border-radius:4px}
.inline-num{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.inline-num input{width:80px}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px}
.sc-list div{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;border-bottom:1px solid var(--border)}
.version{font-size:12px;color:var(--faint)}
.app-footer{text-align:center;font-size:12px;color:var(--faint);padding:4px 18px 20px;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.app-footer a{color:inherit;text-decoration:none}
.app-footer a:hover{text-decoration:underline;color:var(--muted)}
.foot-logo{width:18px;height:18px;object-fit:contain;margin-right:4px;opacity:.75}
.tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--border);position:sticky;top:52px;background:var(--surface);z-index:2}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:8px 14px;color:var(--muted)}
.tabs button.on{border-bottom-color:var(--accent);color:var(--text);font-weight:600}

.help h3{font-size:16px;margin:18px 0 6px}
.help p,.help li{font-size:14px}
.privacy{background:var(--warn-bg);color:var(--warn-text);border-radius:12px;padding:12px 16px;margin:10px 0}
.privacy h3{margin-top:0;color:var(--warn-text);display:flex;gap:6px;align-items:center}
.privacy li{margin:4px 0}
.diagram{width:100%;height:auto;margin:6px 0}

.banner{margin:12px 18px 0;padding:10px 14px;border-radius:var(--radius);background:var(--warn-bg);color:var(--warn-text);display:flex;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast[popover]{inset:auto;bottom:20px;left:50%;right:auto;top:auto;margin:0;border:none;overflow:visible}
</style>
</head>
<body>

<header>
  <h1><span id="logo"></span><span data-i18n="appTitle">Task Organizer</span></h1>
  <div class="spacer"></div>
  <button id="saveStatus" class="status" title=""></button>
  <button id="btnNew" class="primary"></button>
  <button id="btnArchive"></button>
  <button id="btnHelp" class="icon"></button>
  <button id="btnTheme" class="icon"></button>
  <button id="btnLang"></button>
  <button id="btnSettings" class="icon"></button>
</header>

<nav class="areabar" id="areabar">
  <button type="button" data-area="private"></button>
  <button type="button" data-area="business"></button>
</nav>

<div id="banner" class="banner hidden"></div>

<div class="toolbar">
  <div class="search"><span id="searchIcon"></span><input id="search" type="search" autocomplete="off"></div>
  <select id="filterCat" aria-label="Kategorie"></select>
  <select id="filterCust" aria-label="Kunde"></select>
  <button id="btnCustomers"></button>
</div>

<main class="board" id="board"></main>
<footer class="app-footer" id="appFooter"></footer>

<!-- Erfassung / Bearbeitung -->
<dialog id="dlgEditor">
  <div class="dlg-head"><h2 id="edHead"></h2><span class="version" id="edTime"></span><button class="ghost icon" data-close data-i18n-title="btnClose"></button></div>
  <div class="dlg-body dlg-scroll">
    <label for="edTitle" data-i18n="fTitle">Aufgabe</label>
    <input id="edTitle" autocomplete="off">
    <div id="edCustBlock">
      <label for="edCust" data-i18n="fCustomer">Kunde</label>
      <div class="ac-wrap"><input id="edCust" autocomplete="off"><div id="acCust" class="ac hidden"></div></div>
      <div class="grid3">
        <div><label for="edContact" data-i18n="fContact">Ansprechperson</label><input id="edContact" autocomplete="off"></div>
        <div><label for="edPhone" data-i18n="fPhone">Telefon</label><input id="edPhone" type="tel" autocomplete="off"></div>
        <div><label for="edEmail" data-i18n="fEmail">E-Mail</label><input id="edEmail" type="email" autocomplete="off"></div>
      </div>
      <div class="hint" id="edCustHint"></div>
    </div>
    <label for="edCat" data-i18n="fCategory">Kategorie</label>
    <div class="ac-wrap"><span class="cat-dot" id="edCatDot"></span><input id="edCat" class="with-dot" autocomplete="off"><div id="acCat" class="ac hidden"></div></div>
    <div class="swatches" id="edSwatches"></div>
    <div class="hint" id="edCatHint"></div>
    <label data-i18n="fPrio">Priorität</label>
    <div class="seg" id="edPrio">
      <button type="button" data-p="1"></button>
      <button type="button" data-p="2"></button>
      <button type="button" data-p="3"></button>
    </div>
    <label data-i18n="fStatus">Spalte</label>
    <div class="seg" id="edStatus"></div>
    <label for="edDue" data-i18n="fDue">Fällig am</label>
    <div class="due-row"><input id="edDue" type="date"><button type="button" class="ghost icon" id="edDueClear" data-i18n-title="clearDue"></button></div>
    <label data-i18n="fRepeat">Wiederholen</label>
    <div class="seg small" id="edRepeat"></div>
    <div class="rep-box hidden" id="edRepBox">
      <div class="rep-custom hidden" id="edRepCustom"><span data-i18n="repEvery">alle</span><input id="edRepN" type="number" min="1" max="365" step="1" value="3"><select id="edRepUnit"></select></div>
      <div class="seg small" id="edRepMode" style="margin-top:8px"></div>
      <div class="hint" id="edRepHint"></div>
    </div>
    <label for="edNote" data-i18n="fNote">Notiz</label>
    <textarea id="edNote" rows="4"></textarea>
    <div class="err hidden" id="edErr"></div>
  </div>
  <div class="dlg-foot">
    <button id="edDelete" class="danger"></button>
    <div class="spacer"></div>
    <button data-close data-i18n="btnCancel">Abbrechen</button>
    <button id="edSave" class="primary" data-i18n="btnSave">Speichern</button>
  </div>
</dialog>

<!-- Bestätigung / Meldung -->
<dialog id="dlgConfirm">
  <div class="dlg-head"><h2 id="cfTitle"></h2></div>
  <div class="dlg-body"><p id="cfText"></p></div>
  <div class="dlg-foot"><div class="spacer"></div><button id="cfCancel" data-i18n="btnCancel">Abbrechen</button><button id="cfOk" class="primary">OK</button></div>
</dialog>

<!-- Archiv -->
<dialog id="dlgArchive" class="wide">
  <div class="dlg-head"><h2 data-i18n="archTitle">Archiv</h2><button class="ghost icon" data-close data-i18n-title="btnClose"></button></div>
  <div class="dlg-body dlg-scroll">
    <div class="arch-tools">
      <div class="seg small" id="archArea"></div>
      <div class="spacer"></div>
      <input id="archSearch" type="search" style="width:260px" autocomplete="off">
    </div>
    <div id="archContent"></div>
  </div>
  <div class="dlg-foot">
    <button id="archCsv"></button>
    <div class="spacer"></div>
    <button data-close data-i18n="btnClose">Schliessen</button>
  </div>
</dialog>

<!-- Kunden -->
<dialog id="dlgCustomer" class="wide">
  <div class="dlg-head"><button class="ghost icon hidden" id="custBack"></button><h2 id="custTitle"></h2><button class="ghost icon" data-close data-i18n-title="btnClose"></button></div>
  <div class="dlg-body dlg-scroll" id="custBody"></div>
  <div class="dlg-foot" id="custFoot"></div>
</dialog>

<!-- Kunden-Import -->
<dialog id="dlgImport" class="wide">
  <div class="dlg-head"><h2 id="impTitle"></h2><span class="version" id="impFile"></span><button class="ghost icon" data-close data-i18n-title="btnClose"></button></div>
  <div class="dlg-body dlg-scroll" id="impBody"></div>
  <div class="dlg-foot"><span class="hint" id="impCount" style="margin:0"></span><div class="spacer"></div><button data-close data-i18n="btnCancel">Abbrechen</button><button id="impGo" class="primary"></button></div>
</dialog>

<!-- Doppelte Kunden -->
<dialog id="dlgDupes" class="wide">
  <div class="dlg-head"><h2 data-i18n="dupTitle">Doppelte Kunden</h2><button class="ghost icon" data-close data-i18n-title="btnClose"></button></div>
  <div class="dlg-body dlg-scroll" id="dupBody"></div>
  <div class="dlg-foot"><div class="spacer"></div><button data-close data-i18n="btnCancel">Abbrechen</button><button id="dupGo" class="primary"></button></div>
</dialog>

<!-- Einstellungen -->
<dialog id="dlgSettings" class="wide">
  <div class="dlg-head"><h2 data-i18n="settings">Einstellungen</h2><button class="ghost icon" data-close data-i18n-title="btnClose"></button></div>
  <div class="tabs" id="setTabs">
    <button type="button" data-tab="general" data-i18n="tabGeneral">Allgemein</button>
    <button type="button" data-tab="categories" data-i18n="tabCategories">Kategorien</button>
    <button type="button" data-tab="customers" data-i18n="tabCustomers">Kunden</button>
  </div>
  <div class="dlg-body dlg-scroll" id="setBody"></div>
  <div class="dlg-foot"><span class="version" id="setVersion"></span><div class="spacer"></div><button data-close class="primary" data-i18n="btnClose">Schliessen</button></div>
</dialog>

<!-- Hilfe -->
<dialog id="dlgHelp" class="wide">
  <div class="dlg-head"><h2 data-i18n="help">Hilfe</h2><button class="ghost icon" data-close data-i18n-title="btnClose"></button></div>
  <div class="dlg-body dlg-scroll help" id="helpBody"></div>
  <div class="dlg-foot"><span class="version" id="helpVersion"></span><div class="spacer"></div><button data-close class="primary" data-i18n="btnClose">Schliessen</button></div>
</dialog>

<input type="file" id="fileImport" accept=".json,application/json" class="hidden">
<input type="file" id="fileCsv" accept=".csv,.txt,.vcf,text/csv,text/plain,text/vcard,text/x-vcard" class="hidden">
<div id="toast" class="toast" popover="manual"></div>

/* ---------- Speichern: Browser + Datei ---------- */
const fsSupported = 'showSaveFilePicker' in window && 'showOpenFilePicker' in window;
let fileHandle = null, filePermission = 'none', saveState = 'idle', lastSavedAt = 0, writeTimer = null, writeChain = Promise.resolve();
let bannerDismissed = false;

function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('to-db', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }

function persist() {
  state.savedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* Speicher voll */ }
  if (fileHandle && filePermission === 'granted') {
    clearTimeout(writeTimer);
    saveState = 'saving'; updateStatus();
    writeTimer = setTimeout(writeFile, 400);
  } else {
    lastSavedAt = state.savedAt; updateStatus();
  }
}
let persistTimer = null;
function persistSoon() { clearTimeout(persistTimer); persistTimer = setTimeout(persist, 500); }
function writeFile() {
  writeChain = writeChain.then(async () => {
    if (!fileHandle) return;
    try {
      const w = await fileHandle.createWritable();
      await w.write(JSON.stringify(state, null, 2));
      await w.close();
      saveState = 'saved'; lastSavedAt = Date.now();
    } catch (e) {
      console.error(e); saveState = 'error';
    }
    updateStatus();
  });
  return writeChain;
}
async function readHandle(h) {
  const f = await h.getFile();
  const text = await f.text();
  if (!text.trim()) return null;
  const data = JSON.parse(text);
  return isValidData(data) ? data : undefined;
}
async function syncFromFile() {
  try {
    const data = await readHandle(fileHandle);
    if (data === undefined) { toast(t('importBad')); return; }
    if (data && (data.savedAt || 0) > (state.savedAt || 0)) {
      state = normalizeState(data);
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { }
      applyAll();
      saveState = 'saved'; lastSavedAt = state.savedAt; updateStatus();
    } else {
      await writeFile();
    }
  } catch (e) { console.error(e); saveState = 'error'; updateStatus(); toast(t('fileError')); }
}
async function initFile() {
  if (!fsSupported) { updateStatus(); return; }
  try {
    const h = await idbGet('fileHandle');
    if (h) {
      fileHandle = h;
      filePermission = await h.queryPermission({ mode: 'readwrite' });
      if (filePermission === 'granted') await syncFromFile();
    }
  } catch (e) { console.error(e); }
  updateStatus();
}
async function reconnectFile() {
  if (!fileHandle) return;
  try {
    filePermission = await fileHandle.requestPermission({ mode: 'readwrite' });
    if (filePermission === 'granted') { await syncFromFile(); runAutoArchive(); toast(t('fileConnected')); }
  } catch (e) { console.error(e); toast(t('fileError')); }
  updateStatus(); if ($('dlgSettings').open) renderSettings();
}
const JSON_TYPES = [{ description: 'Task Organizer (JSON)', accept: { 'application/json': ['.json'] } }];
async function newFile() {
  try {
    const h = await window.showSaveFilePicker({ suggestedName: 'task-organizer-daten.json', types: JSON_TYPES });
    fileHandle = h; filePermission = 'granted';
    await idbSet('fileHandle', h);
    state.savedAt = Date.now();
    await writeFile();
    toast(t('newFileOk'));
  } catch (e) { if (e.name !== 'AbortError') { console.error(e); toast(t('fileError')); } }
  updateStatus(); if ($('dlgSettings').open) renderSettings();
}
async function openFile() {
  try {
    const [h] = await window.showOpenFilePicker({ types: JSON_TYPES, multiple: false });
    const perm = await h.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { toast(t('fileError')); return; }
    const data = await readHandle(h);
    if (data === undefined) { toast(t('importBad')); return; }
    if (data) {
      if (state.tasks.length || state.categories.length || state.customers.length) {
        const ok = await confirmDlg(t('importConfirmTitle'), t('importConfirmText'));
        if (!ok) return;
      }
      state = normalizeState(data);
    }
    fileHandle = h; filePermission = 'granted';
    await idbSet('fileHandle', h);
    applyAll(); persist(); runAutoArchive();
    toast(t('fileConnected'));
  } catch (e) { if (e.name !== 'AbortError') { console.error(e); toast(t('fileError')); } }
  updateStatus(); if ($('dlgSettings').open) renderSettings();
}
function exportBackup() {

function matches(tk, q) {
  if (!q) return true;
  const c = catById(tk.categoryId), k = custById(tk.customerId);
  return [tk.title, tk.note, c && c.name, k && k.name, k && k.phone, k && k.email, k && k.contact].some(v => String(v || '').toLowerCase().includes(q));
}
function dueCmp(a, b) {
  if (a.due && b.due) return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
  if (a.due) return -1; if (b.due) return 1; return 0;
}
function colorRank(tk) {
  const c = catById(tk.categoryId);
  if (!c) return [9999, ''];
  const i = PALETTE.indexOf(c.color);
  return [i < 0 ? 500 : i, c.name.toLowerCase()];
}
const SORT_FN = {
  prio: (a, b) => a.priority - b.priority || dueCmp(a, b) || a.created - b.created,
  created: (a, b) => b.created - a.created,
  due: (a, b) => dueCmp(a, b) || a.priority - b.priority || a.created - b.created,
  color: (a, b) => { const x = colorRank(a), y = colorRank(b); return x[0] - y[0] || x[1].localeCompare(y[1], 'de') || a.priority - b.priority || a.created - b.created; },
  manual: (a, b) => a.order - b.order || b.created - a.created

const sortTasks = (list, mode) => list.sort(SORT_FN[mode] || SORT_FN.prio);
function colTasks(a, col, filtered) {
  const q = query.trim().toLowerCase();
  return state.tasks.filter(tk => !tk.archived && tk.area === a && tk.status === col
    && (!filtered || (!isHidden(tk) && matches(tk, q) && (!filterCat || (filterCat === '-' ? !tk.categoryId : tk.categoryId === filterCat)) && (!filterCust || tk.customerId === filterCust))));
}
function hiddenTasks(a) {

}

  if (tk.due < today) return { cls: 'over', txt: t('overdue', { date: fmtIso(tk.due) }) };
  if (tk.due === today) return { cls: 'today', txt: t('dueToday') };

/* ---------- Status ändern / verschieben ---------- */
function setStatus(tk, s) {
  const becameDone = s === 'done' && tk.status !== 'done';
  if (becameDone) tk.doneAt = Date.now();
  if (s !== 'done') tk.doneAt = null;
  tk.status = s;
  if (s === 'done') { tk.showFrom = ''; spawnNext(tk); }
}
function spawnNext(tk) {
  if (!tk.repeat || tk.spawnedNext) return null;
  const r = tk.repeat, due = nextDue(tk, r, tk.doneAt);
  tk.seriesId = tk.seriesId || tk.id; tk.spawnedNext = true;
  const n = {
    id: uid(), area: tk.area, created: Date.now(), status: 'planned', order: minOrder(tk.area, 'planned') - 1, doneAt: null, archived: false, archivedAt: null,
    title: tk.title, priority: tk.priority, categoryId: tk.categoryId, customerId: tk.customerId, note: tk.note,
    due, repeat: { ...r }, seriesId: tk.seriesId, spawnedNext: false, showFrom: showFromFor(due, r)
  };
  if (n.showFrom <= todayIso()) n.showFrom = '';
  state.tasks.push(n);
  toast(t('spawned', { date: fmtIso(due) }));
  return n;
}
function moveTask(tk, target, beforeId, positional) {
  const a = tk.area;
  const same = tk.status === target;
  if (same && !positional) return;
  let mode = state.settings.sort[a][target];
  if (positional && same && mode !== 'manual') {
    sortTasks(colTasks(a, target, false), mode).forEach((x, i) => { x.order = i; });
    state.settings.sort[a][target] = 'manual'; mode = 'manual';
    toast(t('switchedManual', { col: t('col_' + target) }));
  }
  tk.showFrom = '';
  setStatus(tk, target);
  if (positional && mode === 'manual') {
    const list = sortTasks(colTasks(a, target, false).filter(x => x.id !== tk.id), 'manual');
    let idx = beforeId ? list.findIndex(x => x.id === beforeId) : -1;
    if (idx < 0) idx = list.length;
    list.splice(idx, 0, tk);
    list.forEach((x, i) => { x.order = i; });
  } else {
    tk.order = minOrder(a, target, tk.id) - 1;
  }
  if (!same && !positional && !(target === 'done' && tk.repeat)) toast(t('moved', { col: t('col_' + target) }));
  renderBoard(); persist();
}

/* ---------- Autovervollständigung ---------- */
function makeAc(input, box, source, render, pick) {
  let items = [], sel = -1;
  const hide = () => { box.classList.add('hidden'); items = []; sel = -1; };
  const draw = () => {
    if (!items.length) { hide(); return; }
    box.innerHTML = items.map((x, i) => '<div data-i="' + i + '" class="' + (i === sel ? 'sel' : '') + '">' + render(x) + '</div>').join('');
    box.classList.remove('hidden');
  };
  const update = () => { items = source(input.value.trim().toLowerCase()); sel = items.length ? 0 : -1; draw(); };
  input.addEventListener('input', update);
  input.addEventListener('focus', update);
  input.addEventListener('keydown', e => {
    if (box.classList.contains('hidden')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, items.length - 1); draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); draw(); }
    else if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey && sel >= 0) { e.preventDefault(); const x = items[sel]; hide(); pick(x); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); hide(); }
    else if (e.key === 'Tab') hide();
  });
  box.addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); const x = items[Number(d.dataset.i)]; hide(); pick(x); } });
  input.addEventListener('blur', () => setTimeout(hide, 150));
  return { hide };
}

const nameKey = v => String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
const normText = v => String(v == null ? '' : v).replace(/[\u00a0\s]+/g, ' ').trim();
const normEmail = v => normText(v).replace(/^mailto:/i, '').replace(/\s/g, '').toLowerCase();
function normPhone(v) {
  const raw = normText(v); if (!raw) return '';
  let d = raw.replace(/\(0\)/g, '').replace(/[^\d+]/g, '');
  if (d.startsWith('00')) d = '+' + d.slice(2);
  if (/^0\d{9}$/.test(d)) d = '+41' + d.slice(1);
  if (/^41\d{9}$/.test(d)) d = '+' + d;
  d = d.replace(/^\+410(\d{9})$/, '+41$1');
  const m = d.match(/^\+41(\d{2})(\d{3})(\d{2})(\d{2})$/);
  return m ? '+41 ' + m[1] + ' ' + m[2] + ' ' + m[3] + ' ' + m[4] : raw;
}

function detectSep(text) {
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  let best = ';', bc = -1;
  [';', ',', '\t'].forEach(sp => { let n = 0, q = false; for (const ch of first) { if (ch === '"') q = !q; else if (ch === sp && !q) n++; } if (n > bc) { bc = n; best = sp; } });
  return best;
}
function parseCsv(text) {
  const sep = detectSep(text), rows = [];
  let row = [], fld = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { fld += '"'; i++; } else q = false; } else fld += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(fld); fld = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(fld); rows.push(row); row = []; fld = ''; }
    else fld += c;
  }
  if (fld !== '' || row.length) { row.push(fld); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

    const u = l.toUpperCase();

    if (u.startsWith('END:VCARD')) { if (cur) out.push(cur); cur = null; return; }
    if (!cur) return;
    const i = l.indexOf(':'); if (i < 0) return;
    const key = l.slice(0, i).split(';')[0].toUpperCase().replace(/^ITEM\d+\./, ''), v = l.slice(i + 1);
    if (key === 'FN') cur.fn = val(v);
    else if (key === 'N') { const p = v.split(';'); cur.n = [p[1], p[0]].map(x => val(x || '').trim()).filter(Boolean).join(' '); }

$('btnHelp').onclick = () => { closeMenu(); renderHelp(); $('dlgHelp').showModal(); $('helpBody').scrollTop = 0; };

/* ---------- Kopfzeile ---------- */
$('btnTheme').onclick = () => { state.settings.theme = effectiveTheme() === 'dark' ? 'light' : 'dark'; applyTheme(); persist(); };
$('btnLang').onclick = () => {
  state.settings.lang = state.settings.lang === 'de' ? 'en' : 'de';
  applyAll(); persist();
  if ($('dlgHelp').open) renderHelp();
  if ($('dlgSettings').open) renderSettings();
  if ($('dlgArchive').open) renderArchive();
  if ($('dlgCustomer').open) renderCustomer();
  if ($('dlgImport').open && imp && imp.items) { $('impTitle').textContent = t('impTitle'); renderImport(); }
  if ($('dlgDupes').open) renderDupes();
};
document.querySelectorAll('dialog [data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));

/* ---------- Tastenkürzel ---------- */
document.addEventListener('keydown', e => {
  const editorOpen = $('dlgEditor').open;
  const anyOpen = !!document.querySelector('dialog[open]');
  const mod = e.ctrlKey || e.metaKey;
  if (menuEl && e.key === 'Escape') { e.preventDefault(); closeMenu(); return; }
  if (e.altKey && !mod && e.code === 'KeyN' && !anyOpen) { e.preventDefault(); openEditor(null); return; }
  if (e.altKey && !mod && e.code === 'KeyB' && !anyOpen) { e.preventDefault(); setArea(curArea() === 'private' ? 'business' : 'private'); return; }
  if (editorOpen) {
    if (mod && e.key === 'Enter') { e.preventDefault(); saveEditor(); return; }
    if (e.altKey && !mod && ['Digit1', 'Digit2', 'Digit3', 'Numpad1', 'Numpad2', 'Numpad3'].includes(e.code)) {
      e.preventDefault(); edPrio = Number(e.code.slice(-1)); renderSeg(); return;
    }
  }
  if (mod && !e.shiftKey && e.code === 'KeyF' && !anyOpen) { e.preventDefault(); $('search').focus(); $('search').select(); }
});

/* ---------- Start ---------- */
applyAll();
lastSavedAt = state.savedAt;
initFile().then(runAutoArchive);
setInterval(() => { runAutoArchive(); renderBoard(); }, 60 * 60 * 1000);
</script>
</body>
</html>
